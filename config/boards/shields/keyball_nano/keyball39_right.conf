CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
# KEEP ON. Disabling this caused big erratic movements on this trackball.
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_FORCE_AWAKE=y
CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# Both inert: the automouse layer only exists when the trackball node sets
# automouse-layer, and it does not. The keymap reaches the mouse layer
# through &lt 6 ESCAPE instead.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

# Uncomment to stream driver logs over USB serial. The trackball driver logs
# every reinitialization and the reason for it, so this is how to tell whether
# a recovery fired at all versus fired and did not help. Only useful while the
# right half is plugged in; leave off for normal wireless use.
# CONFIG_ZMK_USB_LOGGING=y
